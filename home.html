<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/c3777539d2.js"
      crossorigin="anonymous">
    </script>

    <!-- Favicon -->
    <link rel="icon" href="assets/img/favicon.png" type="imagepng" />

    <link rel="stylesheet" href="css/geral.css" />
    <link rel="stylesheet" href="css/home.css">
    <title>StreamMaster - Filmes</title>
  </head>
    <header id="cabecalho filmes">
      <nav class="navbar">
        <picture class="logo">
          <source srcset="assets/img/streammaster-vertical-icone1.png" media="(min-width: 768px)">
          <img src="assets/img/streammaster-horizontal-icone1.png" alt="StreamMaster Logo">
        </picture>

        <button class="btn btn-mobile">
          <i class="fa-solid fa-bars"></i>
        </button>

        <section>
          <ul id="link-nav" class="perf">
            <li><a href="home.html">Início</a></li>
            <li><a href="filmes.html">Filmes</a></li>
            <li><a href="series.html">Séries</a></li>
            <li><a href="upcoming.html">Em Breve</a></li>
          </ul>

          <ul class="nav-perfil show" >
            <li class="search-container">
              <a href="#" id="btnBusca">
                <i class="fa-solid fa-magnifying-glass"></i>
              </a>
              
              <div class="busca" id="boxBusca">
                <input type="text" id="inputBusca" placeholder="Buscar filmes ou séries..."/>
                <ul id="resultadosBusca" class="resultados-busca"></ul>
              </div>
            </li> 
          </ul>

          <ul class="perf menu-perfil">
            <li class="perfil-usuario" id="perfilAtivo"></li>
          </ul>
          
        </section>
      </nav>
    </header>
  <body class="body">
      <div class="capa">
      <div class="capa-conteudo">
        <h1 class="titulo-capa">Ação  Épica e <span>Muito Mais</span></h1>
        <p class="paragrafo-capa">
          Assista agora a filmes incríveis de ação, ficção e as séries mais
          <span>bombadas </span> do momento!
        </p>

        <div class="botoes-capa">
          <a class="btn btn-assista" href="#pravc">
            <i class="fa-solid fa-play"></i> Assista agora
          </a>
          <a class="btn btn-minha-lista-capa" href="#my">
            <i class="fa-solid fa-plus"></i> Minha Lista
          </a>
        </div>

      </div>
    </div>
    <main class="main">
      <h2 class="media filmes-titulo">Recomendados para você</h2>
      <section class="filmes-section">
        <ul class="grid-filmes" id="recomendados">
        </ul>
      </section>

      <h2 class="media filmes-titulo">Filmes em alta</h2>
      <section class="filmes-section">
        <ul class="grid-filmes" id="filmes-populares">
        </ul>
      </section>

      <h2 class="media filmes-titulo">Séries em Alta</h2>
      <section class="filmes-section">
        <ul class="grid-filmes" id="series-populares">
        </ul>
      </section>

      <h2 class="media filmes-titulo">Minha Lista</h2>
      <section class="filmes-section">
        <ul class="grid-filmes" id="minha-lista">
        </ul>
      </section>
    </main>
  </body>
  <!-- 1. BANCO DE DADOS (Contém o array 'filmes' e 'series') -->
    <script src="js/database/filmes.js"></script>
    <script src="js/database/series.js"></script> 

    <!-- 2. GERENCIADORES (Lógica pura, não mexem no HTML sozinhos) -->
    <script src="js/auth.js"></script>
    <script src="js/lista-manager.js"></script>

    <!-- 3. INTERFACE COMUM (Header, Busca, Menu Mobile) -->
    <script src="js/ui-common.js"></script>

    <!-- 4. LÓGICA ESPECÍFICA DA PÁGINA (Renderizar a grade de filmes) -->
    <script src="js/pages/home.js"></script>

    <script>
      verificarAutenticacao();
      renderizarPerfilNoTopo();
    </script>
  </body>
</html>
